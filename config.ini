# RoboMaster Project Configuration
# ===============================

[robot]
# Robot IP address (default for RoboMaster EP/S1)
robot_ip = 192.168.42.2

# Robot connection settings
connection_type = wifi  # wifi or usb
timeout = 10

[sensors]
# Sensor configuration
tof_enabled = true
camera_enabled = true
ir_sensors_enabled = true

# IR sensor ports
ir_left_port = 1
ir_right_port = 2

[movement]
# Movement parameters
default_speed = 0.5  # m/s
rotation_speed = 90  # degrees/s
grid_size = 0.635    # meters

[logging]
# Logging configuration
log_level = INFO
log_file = robot_log.txt
save_map_data = true
map_file = robot_map.csv

[display]
# Real-time display settings
show_realtime_map = true
map_update_interval = 0.1  # seconds
window_width = 800
window_height = 600